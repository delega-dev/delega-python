name: Test

# Reusable workflow called by ci.yml (PR gate) and publish.yml (tag gate).
# Single source of truth for install + test. If a test dep changes, update
# this file only — both callers pick it up automatically.

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test'
        required: false
        type: string
        default: '["3.9", "3.10", "3.11", "3.12", "3.13"]'

jobs:
  test:
    # ubuntu-latest (26.04) no longer ships Python 3.9, which this package still
    # supports (requires-python >=3.9). Pin the runner until 3.9 support is dropped.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[async]"
          pip install pytest pytest-asyncio
          pytest tests/ -v
